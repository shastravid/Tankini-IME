<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Tankini Sanskrit — Full Test Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 24px;
            background: #0f0f13;
            color: #e0e0e0;
        }

        h1 {
            font-size: 1.6em;
            margin-bottom: 16px;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 80px;
            font-family: 'Noto Sans Devanagari', 'Times New Roman', serif;
            font-size: 22px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a24;
            color: #fff;
            margin-bottom: 12px;
        }

        #controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1e1e2e;
            color: #e0e0e0;
            font-size: 13px;
        }
        button:hover { background: #2a2a3e; }

        #status {
            padding: 10px 14px;
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        #summary {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }
        .summary-card {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.2em;
        }
        .summary-pass { background: #0a2f1a; color: #4caf50; border: 1px solid #1b5e20; }
        .summary-fail { background: #2f0a0a; color: #f44336; border: 1px solid #b71c1c; }
        .summary-total { background: #1a1a2e; color: #90caf9; border: 1px solid #1565c0; }

        #log {
            white-space: pre-wrap;
            background: #12121a;
            padding: 14px;
            border: 1px solid #222;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .pass { color: #4caf50; }
        .fail { color: #ff5252; font-weight: bold; }
        .section { color: #90caf9; font-weight: bold; margin-top: 8px; }
    </style>
    <script src='https://s.keyman.com/kmw/engine/18.0.245/keymanweb.js'></script>
</head>

        // ====================================================================
        // KEY SIMULATION ENGINE
        // ====================================================================
        const codeMap = {
            '.': 'Period', '-': 'Minus', ' ': 'Space', ',': 'Comma',
            '?': 'Slash', '\\': 'Backslash', '\n': 'Enter',
            '_': 'Minus', '+': 'Equal', '=': 'Equal',
            ':': 'Semicolon', ';': 'Semicolon', '"': 'Quote', "'": 'Quote',
            '(': 'Digit9', ')': 'Digit0', '!': 'Digit1', '@': 'Digit2',
            '#': 'Digit3', '$': 'Digit4', '%': 'Digit5', '^': 'Digit6',
            '&': 'Digit7', '*': 'Digit8',
        };
        const shiftChars = "!@#$%^&*()_+{}:\"<>?~|";

        async function simulateTyping(ta, seq, kmw) {
            kmw.setActiveElement(ta);
            ta.value = '';
            ta.focus();

            for (let char of seq) {
                let isUpper = (char === char.toUpperCase() && char !== char.toLowerCase()) || shiftChars.includes(char);
                let code = codeMap[char] || ('Key' + char.toUpperCase());
                let charCode = char.charCodeAt(0);
                let keyCode = char.toUpperCase().charCodeAt(0);

                if (char === '.') keyCode = 190;
                if (char === '-') keyCode = 189;
                if (char === ' ') keyCode = 32;
                if (char === '\n') keyCode = 13;
                if (char === '\\') keyCode = 220;
                if (char === ',') keyCode = 188;
                if (char === '(') keyCode = 57;
                if (char === ')') keyCode = 48;

                if (isUpper) {
                    ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', code: 'ShiftLeft', keyCode: 16, which: 16, shiftKey: true, bubbles: true }));
                }

                ta.dispatchEvent(new KeyboardEvent('keydown', { key: char, code: code, charCode: 0, keyCode: keyCode, which: keyCode, shiftKey: isUpper, bubbles: true }));
                ta.dispatchEvent(new KeyboardEvent('keypress', { key: char, charCode: charCode, keyCode: charCode, which: charCode, shiftKey: isUpper, bubbles: true }));
                ta.dispatchEvent(new KeyboardEvent('keyup', { key: char, keyCode: keyCode, which: keyCode, shiftKey: isUpper, bubbles: true }));

                if (isUpper) {
                    ta.dispatchEvent(new KeyboardEvent('keyup', { key: 'Shift', code: 'ShiftLeft', keyCode: 16, which: 16, shiftKey: false, bubbles: true }));
                }

                await new Promise(r => setTimeout(r, 80));
            }

            await new Promise(r => setTimeout(r, 40));
        }

        // ====================================================================
        // TEST RUNNER
        // ====================================================================
        async function runBatch(tests, label, offset) {
            const log = document.getElementById('log');
            const ta = document.getElementById('ta1');
            const kmw = window.keyman;

            log.innerHTML += `<div class='section'>━━━ ${label} (${tests.length} tests) ━━━</div>`;

            for (let i = 0; i < tests.length; i++) {
                let t = tests[i];
                await simulateTyping(ta, t.seq, kmw);

                let actual = ta.value.trim();
                let expected = t.expect.trim();

                if (actual === expected) {
                    passes++;
                } else {
                    log.innerHTML += `<div class='fail'>✗ FAIL: ${t.desc}\n  Input:    "${t.seq}"\n  Expected: "${expected}"\n  Got:      "${actual}"</div>`;
                    fails++;
                    window.failedTests.push(t);
                }

                if ((i + 1) % 20 === 0) {
                    document.getElementById('status').innerText = `Running ${label}... (${offset + i + 1} done)`;
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            updateSummary();
        }

        function updateSummary() {
            const total = passes + fails;
            document.getElementById('summary').innerHTML = `
                <div class="summary-card summary-total">Total: ${total}</div>
                <div class="summary-card summary-pass">✓ Pass: ${passes}</div>
                <div class="summary-card summary-fail">✗ Fail: ${fails}</div>
            `;
        }

        window.runAllTests = async function () {
            const log = document.getElementById('log');
            const kmw = window.keyman;
            log.innerHTML = '';
            passes = 0; fails = 0;
            window.failedTests = [];

            // Fetch generated tests
            let response = await fetch('test_cases.json?v=' + new Date().getTime());
            let genTests = await response.json();

            // Run manual tests first
            await runBatch(manualTests, 'Manual Tests', 0);

            // Run generated tests in batches
            const batchSize = 50;
            for (let i = 0; i < genTests.length; i += batchSize) {
                let batch = genTests.slice(i, i + batchSize);
                await runBatch(batch, `Generated Batch ${Math.floor(i/batchSize) + 1}`, manualTests.length + i);

                // Abort if failure rate too high
                let rate = passes / (passes + fails);
                if (rate < 0.85 && (passes + fails) > 20) {
                    log.innerHTML += `<div class='fail'>⚠ Success rate ${Math.round(rate * 100)}% — aborting remaining tests.</div>`;
                    break;
                }

                await new Promise(r => setTimeout(r, 300));
            }

            document.getElementById('status').innerText = `Complete. Pass: ${passes}, Fail: ${fails}`;
            log.innerHTML += `<div class='section'>━━━ FINAL: Pass ${passes}, Fail ${fails} ━━━</div>`;
        };

        window.runManualOnly = async function () {
            const log = document.getElementById('log');
            log.innerHTML = '';
            passes = 0; fails = 0;
            window.failedTests = [];
            await runBatch(manualTests, 'Manual Tests', 0);
            document.getElementById('status').innerText = `Manual Tests Complete. Pass: ${passes}, Fail: ${fails}`;
            log.innerHTML += `<div class='section'>━━━ FINAL: Pass ${passes}, Fail ${fails} ━━━</div>`;
        };

        window.runFailed = async function () {
            if (window.failedTests.length === 0) {
                alert("No failed tests to retry.");
                return;
            }
            const log = document.getElementById('log');
            log.innerHTML = '';
            let retryBatch = [...window.failedTests];
            passes = 0; fails = 0;
            window.failedTests = [];
            await runBatch(retryBatch, 'Retry Failed', 0);
            document.getElementById('status').innerText = `Retry Complete. Pass: ${passes}, Fail: ${fails}`;
        };

        // ====================================================================
        // INITIALIZATION
        // ====================================================================
        window.onload = function () {
            if (window.keyman) {
                window.keyman.init({ attachType: 'auto' }).then(function () {
                    const kmw = window.keyman;
                    kmw.addKeyboards({
                        id: 'Keyboard_tankini_sanskrit',
                        name: 'Tankini Sanskrit',
                        languages: { id: 'sa', name: 'Sanskrit' },
                        filename: '../build/tankini_sanskrit.js?v=' + new Date().getTime()
                    });

                    let attempts = 0;
                    const activate = setInterval(async () => {
                        attempts++;
                        try {
                            await kmw.setActiveKeyboard('Keyboard_tankini_sanskrit', 'sa');
                            clearInterval(activate);
                            document.getElementById('status').innerText = 'Keyboard loaded. Click "Run All Tests" to start.';
                        } catch (e) {
                            if (attempts > 20) {
                                clearInterval(activate);
                                document.getElementById('status').innerText = 'Failed to activate keyboard: ' + e.message;
                            }
                        }
                    }, 100);
                });
            } else {
                document.getElementById('status').innerText = "KeymanWeb not loaded.";
            }
        };
    </script>
</body>

</html>
